<section class="page-products">
  <h1>Productos</h1>
  <p>Lista de productos disponibles en el inventario.</p>

  <form class="product-form" (ngSubmit)="agregarProducto()">
    <div class="form-row">
      <label>
        Nombre
        <input type="text" name="nombre" [(ngModel)]="nuevoProducto.nombre" required />
      </label>
      <label>
        Categoría
        <input type="text" name="categoria" [(ngModel)]="nuevoProducto.categoria" required />
      </label>
    </div>
    <div class="form-row">
      <label>
        Stock
        <input type="number" name="stock" [(ngModel)]="nuevoProducto.stock" min="0" />
      </label>
      <label>
        Precio
        <input type="number" name="precio" [(ngModel)]="nuevoProducto.precio" min="0" step="0.01" />
      </label>
    </div>
    <button type="submit">Agregar producto</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Stock</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let producto of productos">
        <td>{{ producto.id }}</td>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.categoria }}</td>
        <td>{{ producto.stock }}</td>
        <td>{{ producto.precio | currency:'USD':'symbol':'1.0-0' }}</td>
      </tr>
    </tbody>
  </table>
</section>
